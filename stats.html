<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Word Statistics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary:      #0e4aa4;
      --primary-dark: #0b3d8a;
      --success:      #10b981;
      --danger:       #ef4444;
      --warning:      #f59e0b;
      --bg:           #ffffff;
      --bg-page:      #f5f6fb;
      --bg-strong:    #e4e4f2;
      --border:       #d0d0e8;
      --text-base:    #212529;
      --text-muted:   #666666;
      --text-heading: #0a0a0a;
      --radius-xs:    9px;
      --radius-md:    9999px;
      --shadow:       rgba(0,0,0,0) 0px 0px 0px 0px, rgba(0,0,0,0) 0px 0px 0px 0px, rgba(0,0,0,0.08) 0px 4px 16px 0px;
      --motion:       200ms;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans', Helvetica, sans-serif;
      background: var(--bg-page);
      color: var(--text-base);
      font-size: 12px;
      line-height: 18px;
      min-height: 100vh;
      padding: 32px;
    }

    .container { max-width: 1000px; margin: 0 auto; }

    /* Header */
    .header { text-align: center; margin-bottom: 28px; }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-heading);
      margin-bottom: 6px;
      letter-spacing: -0.03em;
    }

    .header p { color: var(--text-muted); font-size: 13.5px; }

    /* Card */
    .card {
      background: var(--bg);
      border-radius: var(--radius-xs);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card-header {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      background: var(--bg-page);
    }

    /* Search */
    .search-box { position: relative; flex: 1; max-width: 320px; }

    .search-box input {
      width: 100%;
      padding: 9px 38px 9px 13px;
      border: 1px solid var(--border);
      border-radius: var(--radius-xs);
      font-family: 'Noto Sans', Helvetica, sans-serif;
      font-size: 12px;
      outline: none;
      transition: all var(--motion);
      background: var(--bg);
      color: var(--text-base);
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(14, 74, 164, 0.1);
    }

    .search-box input::placeholder { color: var(--text-muted); }

    .search-icon {
      position: absolute;
      right: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 12px;
    }

    .clear-search-btn {
      position: absolute;
      right: 34px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 12px;
      padding: 4px;
      display: none;
    }

    .clear-search-btn:hover { color: var(--text-base); }

    .search-stats { color: var(--text-muted); font-size: 12px; }

    .search-highlight {
      background: var(--bg-strong);
      color: var(--primary);
      padding: 1px 4px;
      border-radius: 4px;
      font-weight: 600;
    }

    /* Table */
    .table-container { overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; }

    th {
      background: var(--bg-page);
      padding: 11px 18px;
      text-align: left;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border-bottom: 1px solid var(--border);
    }

    th:nth-child(2) { text-align: center; width: 100px; }
    th:nth-child(4) { text-align: center; width: 120px; }

    td {
      padding: 13px 18px;
      border-bottom: 1px solid var(--bg-page);
      font-size: 13px;
      color: var(--text-base);
    }

    td:first-child { font-weight: 600; color: var(--text-heading); }
    td:nth-child(2) { text-align: center; }
    td:nth-child(4) { text-align: center; }

    tr:hover { background: var(--bg-page); }
    tr:last-child td { border-bottom: none; }

    /* Badge */
    .count-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 32px;
      height: 22px;
      padding: 0 8px;
      background: var(--bg-strong);
      color: var(--primary);
      border-radius: var(--radius-md);
      font-size: 11px;
      font-weight: 700;
    }

    /* Sentence */
    .sentence-text { color: var(--text-muted); font-size: 12px; line-height: 1.55; }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 7px 13px;
      font-family: 'Noto Sans', Helvetica, sans-serif;
      font-size: 12px;
      font-weight: 600;
      border-radius: var(--radius-xs);
      border: none;
      cursor: pointer;
      transition: all var(--motion);
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }

    .btn-outline {
      background: var(--bg);
      color: var(--text-base);
      border: 1px solid var(--border);
    }
    .btn-outline:hover { border-color: var(--primary); color: var(--primary); }

    .btn-danger { background: var(--bg); color: var(--danger); border: 1px solid var(--danger); }
    .btn-danger:hover { background: #fef2f2; }

    .mastered-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 5px 11px;
      border-radius: var(--radius-xs);
      font-family: 'Noto Sans', Helvetica, sans-serif;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--motion);
    }

    .mastered-btn:hover { background: var(--primary-dark); }

    /* Pagination */
    .card-footer {
      padding: 14px 22px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      background: var(--bg-page);
    }

    .pagination-info { color: var(--text-muted); font-size: 12px; }

    .pagination-controls { display: flex; align-items: center; gap: 6px; }

    .pagination-btn {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-xs);
      color: var(--text-muted);
      cursor: pointer;
      transition: all var(--motion);
      font-size: 11px;
    }

    .pagination-btn:hover:not(:disabled) {
      border-color: var(--primary);
      color: var(--primary);
    }

    .pagination-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .pagination-current { padding: 0 10px; font-size: 12px; color: var(--text-muted); }

    .pagination-current span { font-weight: 700; color: var(--primary); }

    /* Action Buttons */
    .action-bar {
      margin-top: 22px;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* Empty State */
    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .empty-icon  { font-size: 44px; margin-bottom: 14px; opacity: 0.4; }
    .empty-text  { font-size: 15px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }
    .empty-subtext { font-size: 13px; }

    /* Notification */
    .notification {
      position: fixed;
      top: 18px;
      right: 18px;
      padding: 12px 18px;
      border-radius: var(--radius-xs);
      color: white;
      font-size: 13px;
      font-weight: 500;
      z-index: 1000;
      box-shadow: var(--shadow);
      transform: translateX(110%);
      transition: transform var(--motion) ease;
    }
    .notification.show { transform: translateX(0); }
    .notification.success { background: var(--success); }
    .notification.error   { background: var(--danger); }
    .notification.warning { background: var(--warning); }

    /* Responsive */
    @media (max-width: 768px) {
      body { padding: 16px; }
      .header h1 { font-size: 22px; }
      .card-header { flex-direction: column; align-items: stretch; }
      .search-box { max-width: none; }
      th, td { padding: 11px 14px; }
      .card-footer { flex-direction: column; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>Word Statistics</h1>
      <p>Track your learning progress</p>
    </div>

    <!-- Main Card -->
    <div class="card">
      <!-- Search & Filter -->
      <div class="card-header">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Search words..." autocomplete="off" />
          <button id="clearSearchBtn" class="clear-search-btn">✕</button>
          <span class="search-icon">🔍</span>
        </div>
        <div class="search-stats">
          <span id="searchResultsCount">Showing all words</span>
        </div>
      </div>

      <!-- Table -->
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Word</th>
              <th>Count</th>
              <th>Last Sentence</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="statsTable">
            <!-- Populated by stats.js -->
          </tbody>
        </table>
      </div>

      <!-- Pagination -->
      <div class="card-footer">
        <div class="pagination-info">
          <span id="paginationInfo">Showing 1-50 of 0 entries</span>
        </div>
        <div class="pagination-controls">
          <button id="firstPageBtn" class="pagination-btn" title="First">⏮</button>
          <button id="prevPageBtn" class="pagination-btn" title="Previous">◀</button>
          <span class="pagination-current">
            Page <span id="currentPage">1</span> / <span id="totalPages">1</span>
          </span>
          <button id="nextPageBtn" class="pagination-btn" title="Next">▶</button>
          <button id="lastPageBtn" class="pagination-btn" title="Last">⏭</button>
        </div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="action-bar">
      <button id="clearStatsBtn" class="btn btn-danger">Clear Statistics</button>
      <button id="importWordsBtn" class="btn btn-outline">📥 Import Words</button>
      <a href="mastered.html" style="text-decoration: none;">
        <button class="btn btn-primary">📋 Mastered Words</button>
      </a>
    </div>
  </div>

  <script src="stats.js"></script>
</body>
</html>

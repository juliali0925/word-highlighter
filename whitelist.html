<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Whitelist Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary:      #0e4aa4;
      --primary-dark: #0b3d8a;
      --success:      #10b981;
      --danger:       #ef4444;
      --warning:      #f59e0b;
      --bg:           #ffffff;
      --bg-page:      #f5f6fb;
      --bg-strong:    #e4e4f2;
      --border:       #d0d0e8;
      --text-base:    #212529;
      --text-muted:   #666666;
      --text-heading: #0a0a0a;
      --radius-xs:    9px;
      --radius-md:    9999px;
      --shadow:       rgba(0,0,0,0) 0px 0px 0px 0px, rgba(0,0,0,0) 0px 0px 0px 0px, rgba(0,0,0,0.08) 0px 4px 16px 0px;
      --motion:       200ms;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans', Helvetica, sans-serif;
      background: var(--bg-page);
      color: var(--text-base);
      font-size: 12px;
      line-height: 18px;
      min-height: 100vh;
      padding: 32px;
    }

    .container { max-width: 700px; margin: 0 auto; }

    /* Header */
    .header { text-align: center; margin-bottom: 28px; }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-heading);
      margin-bottom: 6px;
      letter-spacing: -0.03em;
    }

    .header p { color: var(--text-muted); font-size: 13.5px; }

    /* Card */
    .card {
      background: var(--bg);
      border-radius: var(--radius-xs);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    /* Add Domain Section */
    .add-section {
      padding: 22px;
      background: var(--bg-page);
      border-bottom: 1px solid var(--border);
    }

    .add-section h3 {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 12px;
    }

    .add-form { display: flex; gap: 9px; }

    .add-form input {
      flex: 1;
      padding: 9px 13px;
      border: 1px solid var(--border);
      border-radius: var(--radius-xs);
      font-family: 'Noto Sans', Helvetica, sans-serif;
      font-size: 12px;
      outline: none;
      transition: all var(--motion);
      background: var(--bg);
      color: var(--text-base);
    }

    .add-form input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(14, 74, 164, 0.1);
    }

    .add-form input::placeholder { color: var(--text-muted); }

    .add-form button {
      padding: 9px 18px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius-xs);
      font-family: 'Noto Sans', Helvetica, sans-serif;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--motion);
    }

    .add-form button:hover { background: var(--primary-dark); }

    /* Message */
    .message {
      padding: 10px 14px;
      margin: 14px 22px 0;
      border-radius: var(--radius-xs);
      font-size: 12px;
      font-weight: 500;
      text-align: center;
      display: none;
    }

    .message.success { display: block; background: #d1fae5; color: #065f46; border-left: 3px solid var(--success); }
    .message.error   { display: block; background: #fee2e2; color: #991b1b; border-left: 3px solid var(--danger); }

    /* Domain List */
    .domain-list { padding: 14px 22px; }

    .domain-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      margin: 6px 0;
      background: var(--bg-page);
      border: 1px solid var(--border);
      border-radius: var(--radius-xs);
      transition: all var(--motion);
    }

    .domain-item:hover { border-color: var(--primary); background: var(--bg); }

    .domain-info { display: flex; flex-direction: column; gap: 2px; }

    .domain-name { font-size: 13.5px; font-weight: 600; color: var(--text-heading); }

    .domain-added { font-size: 10.5px; color: var(--text-muted); }

    .remove-btn {
      background: var(--bg-strong);
      color: var(--text-muted);
      border: none;
      padding: 5px 11px;
      border-radius: var(--radius-xs);
      font-family: 'Noto Sans', Helvetica, sans-serif;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--motion);
    }
    .remove-btn:hover { background: #fee2e2; color: var(--danger); }

    /* Empty State */
    .empty-state { text-align: center; padding: 48px 22px; color: var(--text-muted); }
    .empty-icon  { font-size: 44px; margin-bottom: 14px; opacity: 0.4; }
    .empty-text  { font-size: 15px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }
    .empty-subtext { font-size: 13px; }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 7px 13px;
      font-family: 'Noto Sans', Helvetica, sans-serif;
      font-size: 12px;
      font-weight: 600;
      border-radius: var(--radius-xs);
      border: none;
      cursor: pointer;
      transition: all var(--motion);
    }

    .btn-outline {
      background: var(--bg);
      color: var(--text-base);
      border: 1px solid var(--border);
    }
    .btn-outline:hover { border-color: var(--primary); color: var(--primary); }

    .btn-danger { background: var(--bg); color: var(--danger); border: 1px solid var(--danger); }
    .btn-danger:hover { background: #fef2f2; }

    /* Action Buttons */
    .action-bar {
      margin-top: 22px;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* Responsive */
    @media (max-width: 768px) {
      body { padding: 16px; }
      .header h1 { font-size: 22px; }
      .add-form { flex-direction: column; }
      .add-form button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>Whitelist Manager</h1>
      <p>Only whitelisted sites will highlight words</p>
    </div>

    <!-- Main Card -->
    <div class="card">
      <!-- Add Domain -->
      <div class="add-section">
        <h3>Add Website</h3>
        <div class="add-form">
          <input type="text" id="domainInput" placeholder="Enter domain, e.g. example.com" />
          <button id="addDomainBtn">Add</button>
        </div>
      </div>

      <!-- Message -->
      <div id="message" class="message"></div>

      <!-- Domain List -->
      <div class="domain-list" id="whitelistContainer">
        <!-- Populated by whitelist.js -->
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="action-bar">
      <button id="clearAllBtn" class="btn btn-danger">🗑️ Clear Whitelist</button>
      <button id="backBtn" class="btn btn-outline">← Back</button>
    </div>
  </div>

  <script src="whitelist.js"></script>
</body>
</html>

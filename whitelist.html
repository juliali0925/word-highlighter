<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Whitelist Manager</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-light: #818cf8;
      --primary-dark: #4f46e5;
      --success: #10b981;
      --danger: #ef4444;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-400: #9ca3af;
      --gray-500: #6b7280;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-800: #1f2937;
      --gray-900: #111827;
      --radius: 12px;
      --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: var(--gray-50);
      color: var(--gray-800);
      min-height: 100vh;
      padding: 32px;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--gray-900);
      margin-bottom: 8px;
      letter-spacing: -0.025em;
    }

    .header p {
      color: var(--gray-500);
      font-size: 15px;
    }

    /* Card */
    .card {
      background: white;
      border-radius: var(--radius);
      border: 1px solid var(--gray-200);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    /* Add Domain Section */
    .add-section {
      padding: 24px;
      background: var(--gray-50);
      border-bottom: 1px solid var(--gray-200);
    }

    .add-section h3 {
      font-size: 14px;
      font-weight: 600;
      color: var(--gray-700);
      margin-bottom: 12px;
    }

    .add-form {
      display: flex;
      gap: 10px;
    }

    .add-form input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--gray-200);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
      background: white;
    }

    .add-form input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    .add-form input::placeholder {
      color: var(--gray-400);
    }

    .add-form button {
      padding: 10px 20px;
      background: var(--success);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .add-form button:hover {
      background: #059669;
    }

    /* Message */
    .message {
      padding: 12px 16px;
      margin: 16px 24px 0;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      display: none;
    }

    .message.success {
      display: block;
      background: #d1fae5;
      color: #065f46;
    }

    .message.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    /* Domain List */
    .domain-list {
      padding: 16px 24px;
    }

    .domain-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      margin: 8px 0;
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
      border-radius: 10px;
      transition: all 0.2s;
    }

    .domain-item:hover {
      border-color: var(--gray-300);
      background: white;
    }

    .domain-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .domain-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--gray-800);
    }

    .domain-added {
      font-size: 12px;
      color: var(--gray-400);
    }

    .remove-btn {
      background: var(--gray-100);
      color: var(--gray-600);
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .remove-btn:hover {
      background: #fee2e2;
      color: var(--danger);
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--gray-500);
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .empty-text {
      font-size: 16px;
      font-weight: 500;
      color: var(--gray-600);
      margin-bottom: 4px;
    }

    .empty-subtext {
      font-size: 14px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-outline {
      background: white;
      color: var(--gray-700);
      border: 1px solid var(--gray-300);
    }

    .btn-outline:hover {
      background: var(--gray-50);
      border-color: var(--gray-400);
    }

    .btn-danger {
      background: white;
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    .btn-danger:hover {
      background: #fef2f2;
    }

    /* Action Buttons */
    .action-bar {
      margin-top: 24px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* Responsive */
    @media (max-width: 768px) {
      body {
        padding: 16px;
      }

      .header h1 {
        font-size: 24px;
      }

      .add-form {
        flex-direction: column;
      }

      .add-form button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>Whitelist Manager</h1>
      <p>Only whitelisted sites will highlight words</p>
    </div>

    <!-- Main Card -->
    <div class="card">
      <!-- Add Domain -->
      <div class="add-section">
        <h3>Add Website</h3>
        <div class="add-form">
          <input type="text" id="domainInput" placeholder="Enter domain, e.g. example.com" />
          <button id="addDomainBtn">Add</button>
        </div>
      </div>

      <!-- Message -->
      <div id="message" class="message"></div>

      <!-- Domain List -->
      <div class="domain-list" id="whitelistContainer">
        <!-- Populated by whitelist.js -->
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="action-bar">
      <button id="clearAllBtn" class="btn btn-danger">🗑️ Clear Whitelist</button>
      <button id="backBtn" class="btn btn-outline">← Back</button>
    </div>
  </div>

  <script src="whitelist.js"></script>
</body>
</html>
